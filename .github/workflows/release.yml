name: Release (Manual)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Update channel'
        required: true
        type: choice
        options: [prerelease, stable]
        default: prerelease

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  release:
    name: Sign, notarize, and publish DMG
    needs: verify
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Read and verify release version
        run: |
          RELEASE_TAG="$(bash Scripts/ci-check-release.sh)"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Configure signing and notarization
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: bash Scripts/ci-setup-signing.sh
      - name: Build signed and notarized DMG
        run: bash Scripts/ci-build-release.sh
      - name: Save release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MovemberCam-${{ env.RELEASE_TAG }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish release and signed Sparkle feeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: bash Scripts/ci-publish-update.sh release
      - name: Remove temporary signing credentials
        if: always()
        run: bash Scripts/ci-cleanup-signing.sh
