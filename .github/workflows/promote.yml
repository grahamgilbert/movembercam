name: Promote to Stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing prerelease version, for example 1.0.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve Sparkle tools
        run: |
          xcodebuild -resolvePackageDependencies -project MovemberCam.xcodeproj \
            -scheme MovemberCam -clonedSourcePackagesDirPath build/update-packages
      - name: Promote and sign stable feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          PROMOTE_VERSION: ${{ inputs.version }}
        run: bash Scripts/ci-publish-update.sh promote "$PROMOTE_VERSION"
      - name: Remove temporary signing credentials
        if: always()
        run: bash Scripts/ci-cleanup-signing.sh
