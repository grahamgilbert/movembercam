name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests, video checks, and macOS build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Unit tests
        run: |
          mkdir -p build/verification
          swift test --xunit-output build/verification/unit-tests.xml
      - name: Video and QR integration checks
        run: bash Scripts/verify.sh
      - name: Build app and camera extension without distribution secrets
        run: bash Scripts/build.sh preview
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/verification/
          if-no-files-found: warn
          retention-days: 14
